[tool.ruff]
line-length = 100
target-version = "py313"   # lowest supported version

[tool.ruff.lint]
# Pinned explicitly: relying on ruff's defaults means a ruff upgrade can change
# what CI enforces without any change to this repo.
select = ["E4", "E7", "E9", "F", "I", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
